server {
    # ssl -> https
    listen 5173 ssl;
    server_name localhost;

    # configure the certs
    ssl_certificate     /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # if someone opens http://localhost:5173 (e.g. Docker Desktop's port link), redirect to https

    error_page 497 =301 https://localhost:$server_port$request_uri;

    # security -> hide we're using nginx
    server_tokens off;

    # configure the location the frontend was built to
    root    /usr/share/nginx/html;
    index   index.html;

    # enable compression -> save data
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # security headers -> same ones vite.config.ts sets in dev
    # (the CSP is already a <meta> tag in index.html)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # allow react-router to handle pages
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build files never change, so browsers can cache them
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces the ones above, so repeat the important one
        add_header X-Content-Type-Options "nosniff" always;
    }
}